<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Guacal Música - Próximamente</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
        background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      }

      .construction-container {
        text-align: center;
        max-width: 800px;
        padding: 40px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .logo {
        max-width: 300px;
        margin-bottom: 30px;
      }

      h1 {
        color: #2c3e50;
        margin-bottom: 20px;
        font-size: 2.5em;
      }

      p {
        font-size: 1.2em;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .made-in {
        font-style: italic;
        color: #7f8c8d;
        margin-top: 20px;
      }

      .countdown {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 30px 0;
      }

      .countdown-item {
        background: #2c3e50;
        color: white;
        padding: 15px 20px;
        border-radius: 5px;
        font-size: 1.5em;
        min-width: 70px;
      }

      .countdown-label {
        font-size: 0.8em;
        display: block;
        margin-top: 5px;
        color: #ecf0f1;
      }

      .social-icons {
        margin-top: 30px;
      }

      .social-icons a {
        margin: 0 10px;
        color: #2c3e50;
        font-size: 1.5em;
        transition: color 0.3s;
      }

      .social-icons a:hover {
        color: #e74c3c;
      }

      @media (max-width: 600px) {
        .construction-container {
          padding: 20px;
        }

        .logo {
          max-width: 200px;
        }

        .countdown {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="construction-container">
      <img src="img/under.jpg" alt="El Guacal Música" class="logo" />
      <h1>¡Próximamente!</h1>
      <p>
        Estamos trabajando en algo increíble para ti. Nuestro sitio web estará
        disponible muy pronto.
      </p>

      <div class="countdown">
        <div class="countdown-item">
          <span id="days">00</span>
          <span class="countdown-label">Días</span>
        </div>
        <div class="countdown-item">
          <span id="hours">00</span>
          <span class="countdown-label">Horas</span>
        </div>
        <div class="countdown-item">
          <span id="minutes">00</span>
          <span class="countdown-label">Minutos</span>
        </div>
        <div class="countdown-item">
          <span id="seconds">00</span>
          <span class="countdown-label">Segundos</span>
        </div>
      </div>

      <p>
        Mientras tanto, síguenos en nuestras redes sociales para estar al tanto
        de las novedades.
      </p>

      <div class="social-icons">
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank"><i class="fab fa-spotify"></i></a>
      </div>

      <div class="made-in">Música hecha en Venezuela</div>
    </div>

    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <script>
      // Contador regresivo (ejemplo: 30 días desde hoy)
      const countdown = () => {
        const countDate = new Date();
        countDate.setDate(countDate.getDate() + 30);

        const now = new Date().getTime();
        const gap = countDate - now;

        const second = 1000;
        const minute = second * 60;
        const hour = minute * 60;
        const day = hour * 24;

        const textDay = Math.floor(gap / day);
        const textHour = Math.floor((gap % day) / hour);
        const textMinute = Math.floor((gap % hour) / minute);
        const textSecond = Math.floor((gap % minute) / second);

        document.getElementById("days").innerText =
          textDay < 10 ? "0" + textDay : textDay;
        document.getElementById("hours").innerText =
          textHour < 10 ? "0" + textHour : textHour;
        document.getElementById("minutes").innerText =
          textMinute < 10 ? "0" + textMinute : textMinute;
        document.getElementById("seconds").innerText =
          textSecond < 10 ? "0" + textSecond : textSecond;
      };

      setInterval(countdown, 1000);
    </script>
  </body>
</html>
